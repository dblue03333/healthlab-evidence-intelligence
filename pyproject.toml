[project]
name = "healthlab"
version = "0.1.0"
description = "HealthLab Evidence Intelligence Pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",            # HTTP client for PubMed & FPT APIs
    "pydantic>=2.7.0",          # Data validation & structured schemas
    "pydantic-settings>=2.2.0", # Environment & configuration management
    "python-dotenv>=1.0.0",     # Load .env files
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
