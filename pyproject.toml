[project]
name = "healthlab"
version = "0.1.0"
description = "HealthLab Evidence Intelligence Pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",            # HTTP client for PubMed & FPT APIs
    "pydantic>=2.7.0",          # Data validation & structured schemas
    "pydantic-settings>=2.2.0", # Environment & configuration management
    "python-dotenv>=1.0.0",     # Load .env files
    "truststore>=0.10.4",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage>=3.0,<4",
    "psycopg[binary]>=3.1,<4",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Same rule families as the Safiri backend standard (backend/pyproject.toml).
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line length is handled by the formatter
]
